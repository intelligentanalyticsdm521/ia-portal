<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="760" height="200" viewBox="0 0 760 200">
  <defs>
  <!-- Edge gradients — each flows from node color to Core Blue at center -->
  <linearGradient id="eg-arion"  gradientUnits="userSpaceOnUse" x1="100" y1="24"  x2="100" y2="100"><stop offset="0%" stop-color="#2D9CDB"/><stop offset="100%" stop-color="#0C4A60"/></linearGradient>
  <linearGradient id="eg-spark"  gradientUnits="userSpaceOnUse" x1="166" y1="62"  x2="100" y2="100"><stop offset="0%" stop-color="#E8472A"/><stop offset="100%" stop-color="#0C4A60"/></linearGradient>
  <linearGradient id="eg-oliver" gradientUnits="userSpaceOnUse" x1="166" y1="138" x2="100" y2="100"><stop offset="0%" stop-color="#FEC82C"/><stop offset="100%" stop-color="#0C4A60"/></linearGradient>
  <linearGradient id="eg-stella" gradientUnits="userSpaceOnUse" x1="100" y1="176" x2="100" y2="100"><stop offset="0%" stop-color="#4C5BD4"/><stop offset="100%" stop-color="#0C4A60"/></linearGradient>
  <linearGradient id="eg-forge"  gradientUnits="userSpaceOnUse" x1="34"  y1="138" x2="100" y2="100"><stop offset="0%" stop-color="#27AE7A"/><stop offset="100%" stop-color="#0C4A60"/></linearGradient>
  <linearGradient id="eg-argus"  gradientUnits="userSpaceOnUse" x1="34"  y1="62"  x2="100" y2="100"><stop offset="0%" stop-color="#97CC04"/><stop offset="100%" stop-color="#0C4A60"/></linearGradient>
  <!-- Center radial: Action Orange core melding to Core Blue -->
  <radialGradient id="rg-center" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#EF6C33"/>
    <stop offset="55%"  stop-color="#B8501A"/>
    <stop offset="100%" stop-color="#0C4A60"/>
  </radialGradient>
  <!-- Node inner radial gradients for depth -->
  <radialGradient id="rg-arion"  cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#7DC8EE"/><stop offset="100%" stop-color="#2D9CDB"/></radialGradient>
  <radialGradient id="rg-spark"  cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#F08070"/><stop offset="100%" stop-color="#E8472A"/></radialGradient>
  <radialGradient id="rg-oliver" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#FFE080"/><stop offset="100%" stop-color="#FEC82C"/></radialGradient>
  <radialGradient id="rg-stella" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#8A98E8"/><stop offset="100%" stop-color="#4C5BD4"/></radialGradient>
  <radialGradient id="rg-forge"  cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#70D4A8"/><stop offset="100%" stop-color="#27AE7A"/></radialGradient>
  <radialGradient id="rg-argus"  cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#C8E840"/><stop offset="100%" stop-color="#97CC04"/></radialGradient>
  <!-- Glow filters -->
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="edge-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <rect width="760" height="200" fill="#0C4A60"/>
  <!-- Mark -->
  <g>
  <!-- Edge glow layer -->
  <g filter="url(#edge-glow)" opacity="0.4">
    <line x1="100" y1="24"  x2="100" y2="100" stroke="#2D9CDB" stroke-width="3" stroke-linecap="round"/>
    <line x1="166" y1="62"  x2="100" y2="100" stroke="#E8472A" stroke-width="3" stroke-linecap="round"/>
    <line x1="166" y1="138" x2="100" y2="100" stroke="#FEC82C" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="176" x2="100" y2="100" stroke="#4C5BD4" stroke-width="3" stroke-linecap="round"/>
    <line x1="34"  y1="138" x2="100" y2="100" stroke="#27AE7A" stroke-width="3" stroke-linecap="round"/>
    <line x1="34"  y1="62"  x2="100" y2="100" stroke="#97CC04" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Gradient edges -->
  <line x1="100" y1="24"  x2="100" y2="100" stroke="url(#eg-arion)"  stroke-width="1.8" stroke-linecap="round"/>
  <line x1="166" y1="62"  x2="100" y2="100" stroke="url(#eg-spark)"  stroke-width="1.8" stroke-linecap="round"/>
  <line x1="166" y1="138" x2="100" y2="100" stroke="url(#eg-oliver)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="100" y1="176" x2="100" y2="100" stroke="url(#eg-stella)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34"  y1="138" x2="100" y2="100" stroke="url(#eg-forge)"  stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34"  y1="62"  x2="100" y2="100" stroke="url(#eg-argus)"  stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center node -->
  <circle cx="100" cy="100" r="22" fill="none" stroke="#EF6C33" stroke-width="0.5" opacity="0.25"/>
  <circle cx="100" cy="100" r="18" fill="url(#rg-center)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="18" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
  <!-- Platform nodes -->
  <circle cx="100" cy="24"  r="12" fill="none" stroke="#2D9CDB" stroke-width="0.5" opacity="0.35"/>
  <circle cx="100" cy="24"  r="9.5" fill="url(#rg-arion)"  filter="url(#glow)"/>
  <circle cx="100" cy="24"  r="9.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
  <circle cx="166" cy="62"  r="12" fill="none" stroke="#E8472A" stroke-width="0.5" opacity="0.35"/>
  <circle cx="166" cy="62"  r="9.5" fill="url(#rg-spark)"  filter="url(#glow)"/>
  <circle cx="166" cy="62"  r="9.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
  <circle cx="166" cy="138" r="12" fill="none" stroke="#FEC82C" stroke-width="0.5" opacity="0.35"/>
  <circle cx="166" cy="138" r="9.5" fill="url(#rg-oliver)" filter="url(#glow)"/>
  <circle cx="166" cy="138" r="9.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
  <circle cx="100" cy="176" r="12" fill="none" stroke="#4C5BD4" stroke-width="0.5" opacity="0.35"/>
  <circle cx="100" cy="176" r="9.5" fill="url(#rg-stella)" filter="url(#glow)"/>
  <circle cx="100" cy="176" r="9.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
  <circle cx="34"  cy="138" r="12" fill="none" stroke="#27AE7A" stroke-width="0.5" opacity="0.35"/>
  <circle cx="34"  cy="138" r="9.5" fill="url(#rg-forge)"  filter="url(#glow)"/>
  <circle cx="34"  cy="138" r="9.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
  <circle cx="34"  cy="62"  r="12" fill="none" stroke="#97CC04" stroke-width="0.5" opacity="0.35"/>
  <circle cx="34"  cy="62"  r="9.5" fill="url(#rg-argus)"  filter="url(#glow)"/>
  <circle cx="34"  cy="62"  r="9.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
</g>
  <!-- Wordmark -->
  <!-- Font: Sora 800 — install Sora or embed via @font-face for guaranteed rendering -->
  <text x="232" y="92" font-family="Sora, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="54" letter-spacing="-1.5"
        fill="rgba(255,255,255,0.88)">Intelligent</text>
  <text x="232" y="152" font-family="Sora, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="54" letter-spacing="-1.5"
        fill="#EF6C33">Analytics</text>
</svg>